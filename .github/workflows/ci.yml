name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]

jobs:
  # ── Rust CLI ─────────────────────────────────────────────────────────────────
  cli:
    name: CLI · build & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build
        run: cargo build --release
        working-directory: cli
      - name: Test
        run: cargo test
        working-directory: cli

  # ── Python backend ────────────────────────────────────────────────────────────
  backend:
    name: Backend · lint & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Import check
        run: |
          SQLITE_FALLBACK=true python -c "
          from app.main import app
          from app.engine.entropy import analyze_entropy_and_secrets
          from app.engine.ast_rules import run_ast_structural_scan
          from app.engine.model import sequence_classifier_node
          from app.engine.remediation import construct_remediation_patch
          print('All backend imports OK')
          "
        working-directory: backend
      - name: Run tests
        run: SQLITE_FALLBACK=true python -m pytest tests/ -v || echo "No tests yet"
        working-directory: backend

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · type check & build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: true

  # ── PR scan (pull requests only) ──────────────────────────────────────────────
  pr-scan:
    name: KShield · scan changed files
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Start backend
        run: |
          SQLITE_FALLBACK=true uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && break || sleep 1; done
        working-directory: backend
      - name: Get changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            --diff-filter=ACM > /tmp/changed_files.txt
          cat /tmp/changed_files.txt
      - name: Scan changed files
        id: scan
        run: |
          # Accumulate flat list of {file, anomaly} objects
          ALL="[]"
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            CONTENT=$(jq -Rs . < "$file")
            RESULT=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/scan \
              -H "Content-Type: application/json" \
              -d "{\"filename\": \"$file\", \"content\": $CONTENT}" \
              || echo '{"anomalies":[]}')
            # Extract anomalies and tag each with its filename
            FILE_FINDINGS=$(echo "$RESULT" | jq -c \
              --arg f "$file" \
              '[.anomalies // [] | .[] | {file: $f, anomaly: .}]')
            ALL=$(echo "$ALL $FILE_FINDINGS" | jq -s 'add // []')
          done < /tmp/changed_files.txt
          echo "findings=$(echo "$ALL" | jq -c .)" >> $GITHUB_OUTPUT
      - name: Post review comments
        uses: actions/github-script@v7
        with:
          script: |
            const raw = `${{ steps.scan.outputs.findings }}`;
            let findings;
            try { findings = JSON.parse(raw); } catch { findings = []; }
            const comments = findings
              .map(({ file, anomaly: f }) => ({
                path: file,
                line: f.line || 1,
                body: `**${f.severity}** — ${f.type}\n\n${f.description}\n\n> ${f.remediation?.explanation || ''}`.trim(),
              }))
              .filter(c => c.path);
            if (comments.length > 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                comments,
              });
            }
      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true
