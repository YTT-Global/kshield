[package]
name    = "kshield"
version = "1.1.0"
edition = "2021"

[dependencies]
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
glob        = "0.3"
reqwest     = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
tokio       = { version = "1", features = ["full"] }
