[package]
name    = "kshield"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
reqwest     = { version = "0.12", features = ["json", "blocking"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
